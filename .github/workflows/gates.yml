name: gates

# The standalone tier, on every push. The contract this enforces is the one the
# repository claims: a bare clone, nothing installed, no game, no engine
# checkout. If a change breaks that, it breaks here rather than on somebody
# else's machine three weeks later.
#
# ⚠ WHAT THIS CANNOT COVER, and it is most of what matters. Every gate here is a
# per-object comparison or an offline physics scene. None of them runs UT2004,
# so the integration defects — a recovered geometry accessor that every
# per-object gate links around — are invisible to CI by construction. That tier
# is decomp/test/run-ut2004.sh and it runs on the owner's machine against a real
# match. Green here means the objects are right one at a time.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # EVERYTHING here is -m32. The recovery targets the shipped i386 archives
      # and the acceptance test is byte-identity against their members, so a
      # 64-bit-only toolchain cannot run a single gate in this file.
      #
      # Plus ONE cross compiler that is not optional: `fix_baked_sizeof` measures
      # LLP64 sizes with MinGW-w64 to pin a
      # type against the shipped amd64 build — `long` is 4 bytes there and 8 on
      # Linux, so the two measurements together are what identify a struct.
      # ⚠ Without it that pass makes DIFFERENT repairs, so it is fatal rather
      # than skipped: a runner missing it would otherwise build a different tree
      # that every gate below would still pass.
      - name: i386 + MinGW-w64 toolchains
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++-multilib binutils \
                                  gcc-mingw-w64-x86-64

      - name: The hard gates
        run: |
          set -e
          bash .gates/proven-count.sh
          # ⚠ CALL THE GATE, DO NOT REIMPLEMENT IT. This step used to inline "a
          # whole-tree equivalent" of no-abs-paths — a flat grep for /home/[a-z]
          # — and it was not equivalent: it checked PROSE, which that gate
          # deliberately does not, and it matched /home/icculus, MathEngine's own
          # build directory quoted out of their DWARF, which that gate
          # deliberately exempts. It failed on four documentation lines on every
          # push for weeks, and because this is the FIRST step everything below
          # it was SKIPPED — so the recovery, the i386 acceptance test and the
          # standalone tier had not actually run in CI at all.
          bash .gates/no-abs-paths.sh --all

      - name: Recover
        run: |
          python3 decomp/tools/recover.py \
            --out-dir /tmp/kd_out --build-dir /tmp/kd_build

      # The i386 acceptance test lives inside this: all 145 objects must
      # recompile BYTE-IDENTICAL at -m32, and the post-passes are only allowed
      # to be no-ops there. It is the gate on every generator change.
      #
      # The i386 control runs by default (KD_SKIP_CONTROL unset). Without it
      # scene_ragdoll's measured-unstable ASan verdict — BLOWN UP 3 of 5 at
      # LP64, 5 of 5 at i386, zero sanitizer errors either way — is a coin flip
      # that fails the job for a reason it cannot attribute.
      - name: LP64 pipeline + i386 acceptance
        run: ./decomp/test/standalone/lp64_pipeline.sh

      - name: The product is what the generator produces
        run: python3 decomp/tools/split_libraries.py /tmp/kd_lp64/allobj --check

      # No Android NDK on the runner, so ptrwidth_check reports SKIP. A missing
      # toolchain is not a defect in this repository.
      - name: Standalone tier
        run: ./decomp/test/run-standalone.sh

      - name: metoolkit_decomp builds, and so does its dummy
        run: |
          cmake -S metoolkit_decomp -B /tmp/md \
                -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/md -j"$(nproc)"
          cmake -S metoolkit_decomp_dummy -B /tmp/mdd \
                -DCMAKE_C_FLAGS=-m32 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/mdd -j"$(nproc)"
